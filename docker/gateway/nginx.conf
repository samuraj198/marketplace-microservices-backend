server {
    listen 80;
    server_name localhost;

    # Общие настройки CORS
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, Accept' always;

    # Универсальные заголовки прокси для ВСЕХ микросервисов
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Общие буферы для ответов Laravel
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # === МИКРОСЕРВИС КАТАЛОГА (и API, и Swagger) ===
    location /api/catalog {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        proxy_pass http://catalog_nginx;
    }

    # === МИКРОСЕРВИС ПРОФИЛЯ (и API, и Swagger) ===
        location /api/profile {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_pass http://profile_nginx;
        }

    location / {
        add_header Content-Type application/json always;
        return 404 '{"error": "Endpoint not found"}';
    }
}
