version: '3.8'

services:
  api_gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - catalog_nginx
    networks:
      - marketplace-microservices-backend
  catalog_nginx:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      PHP_HOST: catalog_php
    volumes:
      - ./services/catalog:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - catalog_php
    networks:
      - marketplace-microservices-backend
  catalog_php:
    build:
      context: .
      dockerfile: docker/dockerfiles/php.Dockerfile
    restart: unless-stopped
    volumes:
      - ./services/catalog:/var/www/html
    depends_on:
      - catalog_mysql
    networks:
      - marketplace-microservices-backend
  catalog_mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - services/catalog/.env
    ports:
      - "33061:3306"
    volumes:
      - catalog_db_data:/var/lib/mysql
    networks:
      - marketplace-microservices-backend
  image_processor:
    build:
      context: ./services/image_processor
    env_file:
      - ./services/image_processor/.env
    depends_on:
      - catalog_php
    networks:
      - marketplace-microservices-backend
    restart: unless-stopped

networks:
  marketplace-microservices-backend:
    driver: bridge
volumes:
  catalog_db_data: