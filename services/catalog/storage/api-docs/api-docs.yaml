openapi: 3.0.3
info:
  title: Catalog service
  description: Catalog service
  version: 1.0.0
servers:
  - url: '/api/catalog'
paths:
  /products:
    get:
      tags:
        - Products
      summary: Получить все товары
      responses:
        '200':
          description: Успешное получение всех товаров
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
    post:
      tags:
        - Products (Admin)
      summary: Создание товара
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductStore'
      responses:
        '201':
          description: Успешное создание товара
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /products/{product}:
    get:
      tags:
        - Products
      summary: Получение 1 товара
      parameters:
        - name: product
          in: path
          required: true
          description: Уникальный идентификатор товара
          schema:
            type: integer
      responses:
        '200':
          description: Успешное получение 1 товара
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
    patch:
      tags:
        - Products (Admin)
      summary: Обновление товара
      security:
        - bearerAuth: []
      parameters:
        - name: product
          in: path
          required: true
          description: Уникальный идентификатор товара
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Успешное обновление товара
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    delete:
      tags:
        - Products (Admin)
      summary: Удаление товара
      security:
        - bearerAuth: []
      parameters:
        - name: product
          in: path
          required: true
          description: Уникальный идентификатор товара
          schema:
            type: integer
      responses:
        '204':
          description: Успешное удаление товара
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /products/{product}/image:
    post:
      tags:
        - Products (Admin)
      summary: Добавление картинки для товара
      description: фронт должен делать 2 отдельных запроса на создание товара и на картинку
      security:
        - bearerAuth: []
      parameters:
        - name: product
          in: path
          required: true
          description: Уникальный идентификатор товара
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - img
              properties:
                img:
                  type: string
                  format: binary
                  description: Файл изображения (jpeg, jpg, png, webp). Максимальный размер 10 МБ
      responses:
        '200':
          description: Успешное сохранение картинки
          content:
            application/json:
              schema:
                type: object
                properties:
                  image_path:
                    description: Есть разные размеры картинок, если к названию прибавить суффикс (_large, _small)
                    type: string
                    example: folder/image_name.webp
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /categories:
    get:
      tags:
        - Categories
      summary: Получение категорий
      responses:
        '200':
          description: Успешное получение всех категорий
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
    post:
      tags:
        - Categories (Admin)
      summary: Создание категории
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryStore'
      responses:
        '201':
          description: Успешное создание 1 категории
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /categories/{category}:
    get:
      tags:
        - Categories
      summary: Получение 1 категории
      parameters:
        - name: category
          in: path
          required: true
          description: Уникальный идентификатор категории
          schema:
            type: integer
      responses:
        '200':
          description: Успешное получение 1 категории
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
    patch:
      tags:
        - Categories (Admin)
      summary: Обновление 1 категории
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: path
          required: true
          description: Уникальный идентификатор категории
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: Успешное обновление категории
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    delete:
      tags:
        - Categories (Admin)
      summary: Удаление 1 категории
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: path
          required: true
          description: Уникальный идентификатор категории
          schema:
            type: integer
      responses:
        '204':
          description: Успешное удаление категории
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /categories/{category}/attributes:
    get:
      tags:
        - Attributes
      summary: Получение атрибутов для выбранной категории
      parameters:
        - name: category
          in: path
          required: true
          description: Уникальный идентификатор категории
          schema:
            type: integer
      responses:
        '200':
          description: Успешное получение атрибутов для выбранной категории
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AttributeWithValues'
    post:
      tags:
        - Attributes (Admin)
      summary: Привязка атрибутов к выбранной категории
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: path
          required: true
          description: Уникальный идентификатор категории
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncAttributes'
      responses:
        '204':
          description: Успешная привязка атрибутов к категории
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /categories/{category}/image:
    post:
      tags:
        - Categories (Admin)
      summary: Добавление картинки для категории
      description: фронт должен делать 2 отдельных запроса на создание категории и на картинку
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: path
          required: true
          description: Уникальный идентификатор категории
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - img
              properties:
                img:
                  type: string
                  format: binary
                  description: Файл изображения (jpeg, jpg, png, webp). Максимальный размер 10 МБ
      responses:
        '200':
          description: Успешное сохранение картинки
          content:
            application/json:
              schema:
                type: object
                properties:
                  image_path:
                    description: Есть разные размеры картинок, если добавить суффиксы (_large, _small)
                    type: string
                    example: folder/image_name.webp
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /attributes:
    get:
      tags:
        - Attributes
      summary: Получение всех атрибутов
      responses:
        '200':
          description: Успешное получение всех атрибутов
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AttributeWithValues'
    post:
      tags:
        - Attributes (Admin)
      summary: Создание атрибута
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeStore'
      responses:
        '201':
          description: Успешное создание атрибута
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AttributeWithoutValues'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /attributes/{attribute}:
    patch:
      tags:
        - Attributes (Admin)
      summary: Обновление атрибута
      security:
        - bearerAuth: []
      parameters:
        - name: attribute
          in: path
          required: true
          description: Уникальный идентификатор атрибута
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeUpdate'
      responses:
        '200':
          description: Успешное обновление атрибута
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AttributeWithValues'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    delete:
      tags:
        - Attributes (Admin)
      summary: Удаление атрибута
      security:
        - bearerAuth: []
      parameters:
        - name: attribute
          in: path
          required: true
          description: Уникальный идентификатор атрибута
          schema:
            type: integer
      responses:
        '204':
          description: Успешное удаление атрибута
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /attributes/{attribute}/values:
    post:
      tags:
        - AttributeValues (Admin)
      summary: Добавление значения атрибута
      security:
        - bearerAuth: []
      parameters:
        - name: attribute
          in: path
          required: true
          description: Уникальный идентификатор атрибута
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeValueStore'
      responses:
        '201':
          description: Успешное добавление значения атрибута
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AttributeValue'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /attribute-values/{value}:
    patch:
      tags:
        - AttributeValues (Admin)
      summary: Обновление значения атрибута
      security:
        - bearerAuth: []
      parameters:
        - name: value
          in: path
          required: true
          description: Уникальный идентификатор значения атрибута
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeValueUpdate'
      responses:
        '200':
          description: Успешное изменение значения атрибута
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AttributeValue'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    delete:
      tags:
        - AttributeValues (Admin)
      summary: Удаление значения атрибута
      security:
        - bearerAuth: []
      parameters:
        - name: value
          in: path
          required: true
          description: Уникальный идентификатор значения атрибута
          schema:
            type: integer
      responses:
        '204':
          description: Успешное удаление значения атрибута
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Product name
        description:
          type: string
          example: Product description
        category:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: Category name
        attributes:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              name:
                type: string
                example: Attribute name
              slug:
                type: string
                example: Attribute slug
              value:
                type: string
                example: Attribute value
        quantity:
          type: integer
          example: 5
        img:
          type: string
          example: photo.webp
        price:
          type: number
          example: 1000.00
        article:
          type: string
          example: ART-123113
        created_at:
          type: string
          format: date-time
          example: 2026-01-01T12:34:56Z
    ProductStore:
      type: object
      required:
        - name
        - description
        - category_id
        - price
        - article
      properties:
        name:
          type: string
          example: Product name
        description:
          type: string
          example: Product description
        category_id:
          type: integer
          example: 1
        attributes:
          type: array
          items:
            type: object
            properties:
              attribute_id:
                type: integer
                example: 1
              value_id:
                type: integer
                example: 1
        quantity:
          type: integer
          example: 5
        price:
          type: number
          example: 1000.00
        article:
          type: string
          example: ART-123113
    ProductUpdate:
      type: object
      properties:
        name:
          type: string
          example: Product name
        description:
          type: string
          example: Product description
        category_id:
          type: integer
          example: 1
        attributes:
          type: array
          items:
            type: object
            properties:
              attribute_id:
                type: integer
                example: 1
              value_id:
                type: integer
                example: 1
        quantity:
          type: integer
          example: 5
        price:
          type: number
          example: 1000.00
        article:
          type: string
          example: ART-123113
    Category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Category name
        img:
          type: string
          example: photo.webp
    CategoryStore:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Category name
    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
          example: Category name
    AttributeWithValues:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Attribute name
        slug:
          type: string
          example: attribute_name
        values:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              value:
                type: string
                example: Attribute value name
    AttributeWithoutValues:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Attribute name
        slug:
          type: string
          example: attribute_name
    AttributeStore:
      type: object
      required:
        - name
        - slug
      properties:
        name:
          type: string
          example: Attribute name
        slug:
          type: string
          example: attribute_name
    AttributeUpdate:
      type: object
      properties:
        name:
          type: string
          example: Attribute name
        slug:
          type: string
          example: attribute_name
    SyncAttributes:
      type: object
      properties:
        attributes:
          type: array
          items:
            type: integer
            example: 1
    AttributeValue:
      type: object
      properties:
        id:
          type: integer
          example: 1
        value:
          type: string
          example: Value name
    AttributeValueStore:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          example: Value name
    AttributeValueUpdate:
      type: object
      properties:
        attribute_id:
          type: integer
          example: 1
        value:
          type: string
          example: Value name
  responses:
    UnauthenticatedError:
      description: Пользователь не авторизован или истек срок жизни токена
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthenticated.
    ForbiddenError:
      description: У пользователя недостаточно прав для получения доступа
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Forbidden.
